# The one Checkov config. It sits at the repo root so a scan run from here (`checkov -d .`, as
# a repo-wide security scan does) applies the same rules as infra/policies/check.sh.
# Built-in checks skipped on purpose; the custom policies in infra/policies/checks guard the same
# ground where it matters.
framework:
  - terraform
skip-download: true
external-checks-dir:
  - infra/policies/checks
# The negative fixtures are insecure on purpose: each exists to be rejected by the check
# infra/policies/test.sh names for it, which runs them from their own directory, outside this file.
skip-path:
  - infra/policies/tests
skip-check:
  # No WAF: it would break the 2 USD cap (NFR-019); CKV_PS_007 fails a change that adds one.
  - CKV_AWS_68
  # Logging stays off (NFR-031); CKV_PS_008 fails a change that turns it on.
  - CKV_AWS_86
  # One private origin; there is no second origin to fail over to.
  - CKV_AWS_310
  # A public personal site is served worldwide.
  - CKV_AWS_374
  # The WAF it checks is excluded (NFR-019).
  - CKV2_AWS_47
  # Buckets hold a rebuildable site or a few KB of state; no replica, event stream, lifecycle
  # rule, KMS key (AES256 at rest is on) or versioning on the site bucket (content is rebuilt
  # from git; hashed assets are never deleted, ADR-0011), each of which only adds cost.
  - CKV_AWS_144
  - CKV_AWS_145
  - CKV_AWS_21
  - CKV2_AWS_61
  - CKV2_AWS_62
  # Access logging of the buckets stays off with the rest of the logging (NFR-031).
  - CKV_AWS_18
  # The repository is public on purpose: it is the source of a public site.
  - CKV_GIT_1
  # The only classic branch protection is foundation/github's adopted one: it exists only when the
  # live repository already had it and reproduces it as it is (the first plan changes nothing).
  # Two approvals cannot be met by a solo maintainer, and signed commits would block the existing
  # history's workflow; tightening either is its own reviewed change, and the default ruleset is
  # where xpm sets branch rules.
  - CKV_GIT_5
  - CKV_GIT_6
