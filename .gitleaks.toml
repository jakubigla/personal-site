# Secret scan config: the default rules, minus content hashes that look like keys to them.
[extend]
useDefault = true

[[allowlists]]
description = "xpm design records pin a SHA-256 of the design tokens; a digest is not a credential"
regexTarget = "line"
regexes = ['''"tokens_sha256":\s*"[0-9a-f]{64}"''']
