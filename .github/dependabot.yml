version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/environments/prod
    schedule:
      interval: weekly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: mise
    directory: /
    schedule:
      interval: weekly
