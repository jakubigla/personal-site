# The repo's one gating workflow. Every job runs a mise task, so what CI runs is what
# `mise run <task>` runs locally. ci-ok is the one required check and follows every job.
name: ci

on:
  pull_request:
    # edited: the denylist reads the PR title, which a squash merge writes into main's history, so
    # a title changed without a push must re-run every job. Skipping jobs on a body-only edit would
    # report ci-ok as skipped, which GitHub counts as passing over an earlier red run.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, 'xpm/land/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: 2026.11.14

jobs:
  repo:
    name: repo
    # Where every job runs, written once here and reused through the alias below. A PR from a fork
    # never reaches the self-hosted runner CI_RUNNER names: its code would run on a developer's machine.
    runs-on: &runner ${{ github.run_attempt != 1 && vars.CI_FALLBACK || vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads every commit, not only the tip.
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Secret scan over the full history
        run: mise run repo:secrets
      - name: Hooks over every file
        # CI makes no commit or push, so xpm's own hooks have nothing to guard here.
        run: mise run repo:lint
        env:
          SKIP: xpm-sensitive-scan,xpm-sensitive-scan-push
      - name: Repo script tests
        run: mise run repo:test
      - name: Workflow trust boundary
        # Only the deploy job may hold the OIDC token; actions are pinned; installs are locked.
        run: mise run repo:workflows
      - name: Client-name denylist
        # Fails closed when the secret is unset (ADR-0013): a missing list must never pass silently.
        # On a PR it also reads the branch's commit messages and the PR title: squash merges copy
        # both into main's history.
        run: mise run repo:denylist
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          DENYLIST_COMMITS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          DENYLIST_TITLE: ${{ github.event.pull_request.title }}

  web:
    name: web
    runs-on: *runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: mise run web:install
      - run: mise run web:lint
      - run: mise run web:test
      - run: mise run web:build
      - run: mise run web:e2e-install
      - run: mise run web:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: deploy
    # Inert until the attended first apply sets DEPLOY_ROLE_ARN (ADR-0010). Every check must pass
    # first: a failed denylist or secret scan must never reach the public site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ROLE_ARN != ''
    needs: [repo, web, infra]
    runs-on: *runner
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      # The role is assumed through OIDC: no key or secret exists for this job to read.
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      # Hashed assets go first so a page that reaches the edge mid-deploy never names a file that
      # is not there yet. They are immutable by name. Nothing is ever deleted: older cached HTML
      # still loads its assets (ADR-0011), and the role has no delete right.
      - name: Upload hashed assets
        run: aws s3 sync site/_astro "s3://$SITE_BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      # Everything else, HTML included, revalidates within five minutes so a release shows quickly.
      - name: Upload HTML and the rest
        run: aws s3 sync site "s3://$SITE_BUCKET" --exclude "_astro/*" --cache-control "public, max-age=300"
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      - name: Invalidate the cache and wait for it
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
        env:
          DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}

  infra:
    name: infra
    runs-on: *runner
    timeout-minutes: 10
    # No AWS credentials: every apply is attended (ADR-0010), so CI only checks the code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: mise run infra:fmt
      - run: mise run infra:validate
      - name: tflint
        run: mise run infra:lint
        env:
          # tflint downloads its ruleset from GitHub; a token avoids the shared-IP rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Policies reject what they must, and the roots pass them
        run: mise run infra:policies
      # The github-config workflow is path-filtered, so it cannot be a required check; running the
      # same task here puts it under ci-ok on every pull request.
      - name: GitHub settings stack static checks
        run: mise run github:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [repo, web, infra, deploy]
    runs-on: *runner
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || { echo "a job ended $r"; exit 1; }
          done
