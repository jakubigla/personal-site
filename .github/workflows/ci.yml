# Baseline CI: the repo's one full-suite workflow. The walking skeleton (EN-001) adds the web,
# infra, repo and deploy jobs here (docs/architecture.md, ADR-0016); ci-ok stays the one
# required check and aggregates every job.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'xpm/land/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: baseline
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Committed config files parse
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          try:
              import tomllib
          except ImportError:
              tomllib = None
          files = subprocess.run(["git", "ls-files", "*.json", "*.toml"], capture_output=True, text=True, check=True).stdout.split()
          if tomllib is None:
              print(f"python {sys.version.split()[0]} has no tomllib: TOML files not parsed")
              files = [f for f in files if f.endswith(".json")]
          bad = []
          for f in files:
              try:
                  with open(f, "rb") as fh:
                      (json.load if f.endswith(".json") else tomllib.load)(fh)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad) or f"{len(files)} files parse")
          sys.exit(1 if bad else 0)
          PY
      - name: No merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "merge-conflict markers found"; exit 1
          fi

  infra:
    name: infra
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    # No AWS credentials: every apply is attended (ADR-0010), so CI only checks the code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install Checkov
        run: pip install --no-cache-dir checkov==3.4.11
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate and tflint
        run: |
          for root in infra/bootstrap infra/environments/prod; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
          for dir in infra/bootstrap infra/environments/prod infra/modules/site-hosting infra/modules/cost-guard; do
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
          done
      - name: Policies reject what they must, and the roots pass them
        run: infra/policies/test.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [baseline, infra]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a job ended $r"; exit 1; }
          done
